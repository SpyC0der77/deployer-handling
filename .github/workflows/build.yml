name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate resources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          mixins = Path("src/main/resources/deployerhold.mixins.json")
          lang = Path("src/main/resources/assets/deployerhold/lang/en_us.json")
          at = Path("src/main/resources/META-INF/accesstransformer.cfg")
          mods_toml = Path("src/main/templates/META-INF/neoforge.mods.toml")

          for path in (mixins, lang, at, mods_toml):
              assert path.is_file(), f"missing {path}"

          mixins_json = json.loads(mixins.read_text())
          assert mixins_json["required"] is True
          assert mixins_json["package"] == "com.carterstach.deployerhold.mixin"
          assert set(mixins_json["mixins"]) == {
              "DeployerModeMixin",
              "DeployerBlockEntityMixin",
              "DeployerHandlerMixin",
          }

          lang_json = json.loads(lang.read_text())
          required_keys = {
              "deployerhold.tooltip.deployer.grip_pull",
              "deployerhold.tooltip.deployer.grip_hitch",
              "deployerhold.tooltip.deployer.latch_open",
              "deployerhold.tooltip.deployer.latch_ready",
              "deployerhold.tooltip.deployer.latch_latched",
              "deployerhold.tooltip.deployer.latch_locked",
          }
          missing = required_keys - set(lang_json)
          assert not missing, f"missing lang keys: {sorted(missing)}"

          toml = mods_toml.read_text()
          for needle in ("modId = \"${mod_id}\"", "[[mixins]]", "create", "sable", "simulated"):
              assert needle in toml, f"neoforge.mods.toml missing {needle!r}"

          print("Resource validation OK")
          PY

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify jar artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/deployerhold-*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No deployerhold jar found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          # Prefer the main mod jar (skip -sources / -javadoc if present)
          main_jar=""
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar) continue ;;
              *) main_jar="$jar"; break ;;
            esac
          done
          if [ -z "$main_jar" ]; then
            echo "Only sources/javadoc jars found" >&2
            exit 1
          fi
          echo "Checking $main_jar"
          jar tf "$main_jar" | grep -q 'com/carterstach/deployerhold/DeployerHoldMod.class'
          jar tf "$main_jar" | grep -q 'deployerhold.mixins.json'
          jar tf "$main_jar" | grep -q 'META-INF/neoforge.mods.toml'
          jar tf "$main_jar" | grep -q 'assets/deployerhold/lang/en_us.json'
          echo "Jar verification OK: $main_jar"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: deployerhold-build
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
          retention-days: 14
